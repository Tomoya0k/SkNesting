<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkNesting · Prueba local</title>
  </head>
  <body>
    <main class="app">
      <header><h1>SkNesting</h1></header>
      <section class="panel" aria-label="Parámetros de acomodo">
        <label class="file-label">Archivo SVG o EPS<input id="file" type="file" accept=".svg,.eps,image/svg+xml,application/postscript" /></label>
        <fieldset class="artwork-size">
          <legend>Medidas físicas del diseño</legend>
          <div class="artwork-size-fields">
            <label>Ancho del diseño (cm)<input id="artwork-width" type="number" min="0" step="any" inputmode="decimal" disabled /></label>
            <label>Alto del diseño (cm)<input id="artwork-height" type="number" min="0" step="any" inputmode="decimal" disabled /></label>
          </div>
          <label class="aspect-lock" title="Bloquear proporción">
            <input id="lock-aspect" type="checkbox" aria-label="Bloquear proporción" checked disabled />
            <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
              <path class="lock-shackle-closed" d="M6.5 8V6a3.5 3.5 0 0 1 7 0v2" />
              <path class="lock-shackle-open" d="M6.5 8V6a3.5 3.5 0 0 1 6.35-2.05" />
              <rect x="3.5" y="8" width="13" height="10" rx="2" />
              <circle cx="10" cy="12.5" r="1" />
              <path d="M10 13.5v1.75" />
            </svg>
          </label>
        </fieldset>
        <div class="fields">
          <label>Ancho de hoja (cm)<input id="width" type="number" min="0" step="any" value="180" /></label>
          <label>Alto de hoja (cm)<input id="height" type="number" min="0" step="any" value="240" /></label>
          <label>Separación entre piezas (cm)<input id="gap" type="number" min="0" step="any" value="0.5" /></label>
          <label>Margen exterior (cm)<input id="edge" type="number" min="0" step="any" value="2" /></label>
        </div>
        <div class="actions"><button id="calculate" type="button">Calcular acomodo</button><button id="cancel" type="button" disabled>Cancelar</button></div>
        <p id="status" role="status">Carga un SVG con medidas físicas o un EPS con BoundingBox.</p>
        <progress id="progress" max="1" value="0" hidden></progress>
      </section>
      <section id="results" class="panel" hidden>
        <div id="summary" class="summary"></div>
        <div id="sheet-stage" class="sheet-list"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
